name: lore-screenshots

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lore
      POSTGRES_USER: lore
      POSTGRES_PASSWORD: lore
    ports:
      - "127.0.0.1:${SCREENSHOT_DB_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore -d lore"]
      interval: 1s
      timeout: 3s
      retries: 30
