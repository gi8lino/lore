---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lore-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lore-pdf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lore-pdf
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pdf
          image: ghcr.io/gi8lino/html2pdf:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
