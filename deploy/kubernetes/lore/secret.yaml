---
apiVersion: v1
kind: Secret
metadata:
  name: lore-db
stringData:
  database-url: postgres://lore:change-me@postgres:5432/lore?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: lore-oidc
  namespace: lore
type: Opaque
stringData:
  LORE__OIDC_ISSUER: https://sso.${BASE_DOMAIN}/realms/hq
  LORE__OIDC_CLIENT_ID:
  LORE__OIDC_CLIENT_SECRET: # copy from your identity provider
  # Run openssl rand -base64 32 once; paste the full output below.
  # Keep this value across replicas/restarts; use a separate value from the encryption key.
  LORE__OIDC_SESSION_SECRET:
---
apiVersion: v1
kind: Secret
metadata:
  name: lore-config
  namespace: lore
type: Opaque
stringData:
  # Run openssl rand -base64 32 separately; paste all 44 characters, including the trailing =.
  # Keep the original key across replicas/restarts to preserve access to encrypted settings.
  LORE__ENCRYPTION_KEY:


