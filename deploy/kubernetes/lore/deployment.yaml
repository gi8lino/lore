---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lore
    spec:
      containers:
        - name: lore
          image: ghcr.io/gi8lino/lore:latest
          imagePullPolicy: Always
          env:
            - name: LORE__DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lore
                  key: database-url
            - name: LORE__LISTEN_ADDRESS
              value: 0.0.0.0:8080
            - name: LORE__PUBLIC_URL
              value: https://lore.example.test
            - name: LORE__PDF_URL
              value: http://html2pdf:8080/render
            - name: LORE__LOG_FORMAT
              value: json
            - name: LORE__ACCESS_LOG
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
