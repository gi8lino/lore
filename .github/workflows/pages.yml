---
name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "lore-site.toml"
      - "internal/site/**"
      - "internal/cli/**"
      - "internal/markdown/**"
      - "internal/icons/**"
      - "web/**"
      - "scripts/web/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "go.mod"
      - "go.sum"
      - "cmd/main.go"
      - "Makefile"
      - ".github/workflows/pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "lore-site.toml"
      - "internal/site/**"
      - "internal/cli/**"
      - "internal/markdown/**"
      - "internal/icons/**"
      - "web/**"
      - "scripts/web/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "go.mod"
      - "go.sum"
      - "cmd/main.go"
      - "Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: make download

      - name: Build static documentation
        run: make site

      - name: Verify static output
        run: |
          test -s docs/site/index.html
          test -s docs/site/assets/css/app.css
          test -s docs/site/assets/js/static.js
          test -f docs/site/.nojekyll

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
